<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cores do Life</title>
<style>
  body{margin:0;background:#0e1311;color:#e8efe9;font:15px/1.4 system-ui,sans-serif;padding:24px 16px}
  h1{font-size:20px;margin:0 0 4px} p{margin:0 0 20px;color:#9aa8a0}
  .grade{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
  .cartao{background:#161d1a;border:1px solid #26302b;border-radius:20px;padding:12px 12px 16px;width:220px;text-align:center}
  .palco{position:relative;height:300px;overflow:visible}
  .palco iframe{position:absolute;bottom:-4.8%;left:-12.5%;width:125%;height:119%;border:0;background:transparent;pointer-events:none}
  b{display:block;margin-top:8px} small{color:#9aa8a0}
  .botoes{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button{background:#64c27b;color:#0e1311;border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<h1>Cores do Life — prévia</h1>
<p>Só para o dono aprovar. Os botões mandam os Lifes reagirem juntos.</p>
<div class="grade">
  <div class="cartao"><div class="palco"><iframe src="/life/vivo/foco.html?v=padrao"></iframe></div><b>Verde</b><small>Todo mundo</small></div>
  <div class="cartao"><div class="palco"><iframe src="/life/vivo/foco.html?v=padrao&cor=amarelo"></iframe></div><b>Amarelo clarinho</b><small>Antes do início (lista de espera)</small></div>
  <div class="cartao"><div class="palco"><iframe src="/life/vivo/foco.html?v=padrao&cor=rosa"></iframe></div><b>Rosa clarinho</b><small>Antes do início (lista de espera)</small></div>
  <div class="cartao"><div class="palco"><iframe src="/life/vivo/foco.html?v=padrao&cor=perola&ac=aureola"></iframe></div><b>Branco pérola + auréola</b><small>Apoiador Anjo (Fundador)</small></div>
</div>
<div class="botoes">
  <button data-m="toque">Tocar (pula e sorri)</button>
  <button data-m="feliz">Feliz</button>
  <button data-m="conquista">Conquista</button>
</div>
<script>
  document.querySelectorAll('button').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('iframe').forEach(function(f){
      var m=b.dataset.m;
      f.contentWindow.postMessage(m==='feliz'?{lifeVivo:'expr',id:'feliz'}:{lifeVivo:m},'*');
    });
  }});
</script>
</body>
</html>
