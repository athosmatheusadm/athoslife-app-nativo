<title>Prévia do Scanner ATHOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a foto ocupa a tela inteira; por cima, só um painel de vidro no rodapé
   com uma linha por item. Tocar numa linha abre o ajuste dela (uma de cada vez).
   Tokens = os do app (src/ui/theme/globals.css). Sobre a foto o vidro é sempre escuro,
   como na câmera; a página em volta segue o tema. */
:root {
  --brand: 34 197 94; --brand-ink: 4 18 10;
  --gold: 251 191 36; --prot: 96 165 250; --carb: 251 146 60; --gord: 250 204 21;
  --vidro: 14 16 15; --linha-vidro: 255 255 255; --txt-vidro: 255 255 255;
  --fundo: 12 12 12; --hi: 255 255 255; --low: 156 163 175;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --fundo: 232 238 233; --hi: 17 24 20; --low: 87 96 108; color-scheme: light;
} }
:root[data-theme="light"] { --fundo: 232 238 233; --hi: 17 24 20; --low: 87 96 108; color-scheme: light; }
* { box-sizing: border-box; }
body { background: rgb(var(--fundo)); color: rgb(var(--hi)); font-family: var(--sans); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; }
.topo { max-width: 380px; margin: 0 auto 14px; display: grid; gap: 4px; }
.topo h1 { font-size: 15px; margin: 0; font-weight: 700; text-wrap: balance; }
.topo p { margin: 0; font-size: 12.5px; color: rgb(var(--low)); line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }

.tela { position: relative; max-width: 380px; aspect-ratio: 9 / 19; margin: 0 auto; border-radius: 32px; overflow: hidden;
  background: rgb(var(--vidro)); color: rgb(var(--txt-vidro)); box-shadow: 0 24px 60px rgb(0 0 0 / .35); }
.fundo { position: absolute; inset: 0; width: 100%; height: 100%; max-width: 100%; object-fit: cover; object-position: 50% 22%; }
.tela::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(rgb(0 0 0 / .35), transparent 18%, transparent 42%, rgb(0 0 0 / .72) 78%); }

.vidro { background: rgb(var(--vidro) / .42); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid rgb(var(--linha-vidro) / .14); }

.barra { position: absolute; z-index: 2; top: 14px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.redondo { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 17px; }
.destino { height: 32px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; font-size: 13px; font-weight: 600; }

.painel { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: 14px; display: grid; gap: 6px; }
.total { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 4px 2px; text-shadow: 0 1px 8px rgb(0 0 0 / .5); }
.total .kcal { font-family: var(--mono); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.total .kcal small { font-family: var(--sans); font-size: 13px; font-weight: 600; opacity: .8; margin-left: 4px; letter-spacing: 0; }
.total .mac { font-family: var(--mono); font-size: 13px; font-weight: 700; display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
.p { color: rgb(var(--prot)); } .c { color: rgb(var(--carb)); } .g { color: rgb(var(--gord)); }

ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.item { border-radius: 14px; overflow: hidden; transition: opacity .2s; }
.item.pendente { border-color: rgb(var(--gold) / .7); }
.item.fora { opacity: .45; }
.item.fora .nome { text-decoration: line-through; }
.cab-item { display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; min-height: 46px; padding-right: 12px; }
.check { width: 44px; height: 46px; display: grid; place-items: center; }
.check span { width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid rgb(var(--linha-vidro) / .6); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: transparent; }
.check[aria-checked="true"] span { border-color: rgb(var(--brand)); background: rgb(var(--brand)); color: rgb(var(--brand-ink)); }
.abrir { display: contents; text-align: left; }
.nome { min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.nome em { font-style: normal; font-weight: 500; font-size: 12px; color: rgb(var(--gold)); margin-left: 6px; }
.gramas { font-family: var(--mono); font-size: 12px; opacity: .75; padding-right: 10px; font-variant-numeric: tabular-nums; }
.kc { font-family: var(--mono); font-size: 13px; font-weight: 700; min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }

.ajuste { padding: 2px 12px 12px; display: grid; gap: 8px; border-top: 1px solid rgb(var(--linha-vidro) / .1); padding-top: 10px; }
.passo { display: flex; align-items: center; gap: 6px; }
.passo button { width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgb(var(--linha-vidro) / .25); font-size: 17px; }
.passo span { min-width: 64px; text-align: center; font-family: var(--mono); font-size: 14px; font-weight: 700; }
.passo .detalhe { margin-left: auto; font-size: 11px; font-family: var(--mono); display: flex; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 32px; border-radius: 999px; border: 1px solid rgb(var(--linha-vidro) / .22); padding: 0 12px; font-size: 12px; font-weight: 600; }
.chip[aria-pressed="true"] { border-color: rgb(var(--brand)); background: rgb(var(--brand) / .22); color: rgb(var(--brand)); }
.nota { margin: 0; font-size: 11.5px; line-height: 15px; opacity: .72; }
.nota.aviso { color: rgb(var(--gold)); opacity: 1; }

.salvar { margin-top: 4px; width: 100%; min-height: 50px; border-radius: 999px; background: rgb(var(--brand)); color: rgb(var(--brand-ink)); font-size: 15px; font-weight: 700; }
.salvar:disabled { background: rgb(var(--vidro) / .55); color: rgb(var(--gold)); border: 1px solid rgb(var(--gold) / .6); cursor: not-allowed; }
.dica { margin: 0; text-align: center; font-size: 11.5px; opacity: .7; }
@media (prefers-reduced-motion: reduce) { .item { transition: none; } }
</style>

<div class="topo">
  <h1>Scanner: a foto é a tela</h1>
  <p>Exemplo com o bowl de frango, arroz e brócolis. Números da TACO. Toque numa linha pra ajustar gramas e preparo; o ✓ tira ou põe o item.</p>
</div>

<main class="tela" aria-label="Revisão do scanner">
  <img class="fundo" src="prato.webp" alt="Foto do prato: bowl com arroz, frango grelhado e brócolis">

  <div class="barra">
    <button class="redondo vidro" aria-label="Voltar">←</button>
    <span class="destino vidro">Almoço</span>
    <button class="redondo vidro" aria-label="Tirar outra foto">↻</button>
  </div>

  <section class="painel">
    <div class="total" id="total"></div>
    <ul id="lista"></ul>
    <button class="salvar" id="salvar"></button>
    <p class="dica" id="dica">Toque num item pra ajustar</p>
  </section>
</main>

<script>
// Bases por 100 g (TACO 4ª ed.). pct = óleo de preparo caseiro (% do peso).
const B = {
  arroz:  { nome: 'Arroz branco', k: 128, p: 2.5, c: 28.1, g: 0.2, pct: 2.5 },
  frango: { nome: 'Frango grelhado', k: 159, p: 32, c: 0, g: 2.5, pct: 2 },
  brocC:  { nome: 'Brócolis cozido', k: 25, p: 2.1, c: 4.4, g: 0.5, pct: null },
  brocR:  { nome: 'Brócolis cru', k: 25, p: 3.6, c: 4.0, g: 0.3, pct: null },
}
const MULT = { sem_oleo: 0, caseiro: 1, bastante_oleo: 2 }
const NOMES_V = { sem_oleo: 'Sem óleo', caseiro: 'Caseiro', bastante_oleo: 'Bastante óleo' }
const itens = [
  { id: 'a', base: B.frango, g: 140, v: 'caseiro', origem: 'padrao', on: true },
  { id: 'b', base: B.arroz, g: 160, v: 'caseiro', origem: 'padrao', on: true, porcao: [120, 200] },
  { id: 'c', base: null, visto: 'Brócolis', cand: [B.brocC, B.brocR], g: 90, v: null, on: true },
]
let aberto = null

function macros(i) {
  if (!i.base) return null
  const f = i.g / 100, b = i.base
  const oleo = b.pct !== null && i.v ? i.g * b.pct / 100 * MULT[i.v] : 0
  return { k: Math.round(b.k * f + oleo * 9), p: Math.round(b.p * f * 10) / 10, c: Math.round(b.c * f * 10) / 10, g: Math.round((b.g * f + oleo) * 10) / 10 }
}
const el = (tag, attrs = {}, ...filhos) => {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) k === 'on' ? e.addEventListener('click', v) : e.setAttribute(k, v)
  for (const f of filhos) e.append(f)
  return e
}
const span = (cls, txt) => el('span', { class: cls }, txt)

function render() {
  const lista = document.getElementById('lista')
  lista.replaceChildren()
  for (const i of itens) {
    const m = macros(i)
    const li = el('li', { class: 'item vidro' + (i.base ? '' : ' pendente') + (i.on ? '' : ' fora') })
    const check = el('button', { class: 'check', role: 'checkbox', 'aria-checked': String(i.on), 'aria-label': (i.on ? 'Tirar ' : 'Incluir ') + (i.base?.nome ?? i.visto),
      on: () => { i.on = !i.on; render() } }, el('span', {}, '✓'))
    const nome = el('span', { class: 'nome' }, i.base ? i.base.nome : i.visto)
    if (!i.base) nome.append(el('em', {}, 'qual é?'))
    const abrir = el('button', { class: 'abrir', 'aria-expanded': String(aberto === i.id), on: () => { aberto = aberto === i.id ? null : i.id; render() } },
      nome, span('gramas', i.g + ' g'), span('kc', m ? m.k + ' kcal' : '—'))
    li.append(el('div', { class: 'cab-item' }, check, abrir))

    if (aberto === i.id) {
      const aj = el('div', { class: 'ajuste' })
      if (i.cand) {
        const chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Qual é?' })
        for (const c of i.cand) chips.append(el('button', { class: 'chip', 'aria-pressed': String(i.base === c), on: () => { i.base = c; render() } }, c.nome))
        aj.append(chips)
      }
      const det = el('span', { class: 'detalhe' })
      if (m) det.innerHTML = `<span class="p">P ${m.p}</span><span class="c">C ${m.c}</span><span class="g">G ${m.g}</span>`
      aj.append(el('div', { class: 'passo' },
        el('button', { 'aria-label': 'Menos 10 gramas', on: () => { i.g = Math.max(0, i.g - 10); render() } }, '−'),
        el('span', {}, i.g + ' g'),
        el('button', { 'aria-label': 'Mais 10 gramas', on: () => { i.g += 10; render() } }, '+'),
        det))
      if (i.base && i.base.pct !== null) {
        const chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Preparo' })
        for (const v of Object.keys(MULT)) chips.append(el('button', { class: 'chip', 'aria-pressed': String(i.v === v), on: () => { i.v = v; i.origem = 'usuario'; render() } }, NOMES_V[v]))
        aj.append(chips)
        if (i.origem === 'padrao' && i.v === 'caseiro') aj.append(el('p', { class: 'nota' }, 'Considerei preparo caseiro comum (com óleo).'))
      }
      if (i.porcao) aj.append(el('p', { class: 'nota aviso' }, `Parte fica embaixo do frango. Confira (≈ ${i.porcao[0]}–${i.porcao[1]} g).`))
      li.append(aj)
    }
    lista.append(li)
  }

  const inc = itens.filter((i) => i.on)
  const pend = inc.find((i) => !i.base)
  const t = inc.reduce((s, i) => { const m = macros(i); if (m) { s.k += m.k; s.p += m.p; s.c += m.c; s.g += m.g } return s }, { k: 0, p: 0, c: 0, g: 0 })
  document.getElementById('total').innerHTML =
    `<span class="kcal">${Math.round(t.k)}<small>kcal${pend ? ' parcial' : ''}</small></span>` +
    `<span class="mac"><span class="p">P ${Math.round(t.p)}g</span><span class="c">C ${Math.round(t.c)}g</span><span class="g">G ${Math.round(t.g)}g</span></span>`
  const btn = document.getElementById('salvar')
  btn.disabled = !!pend || inc.length === 0
  btn.textContent = pend ? `Escolha o tipo de ${pend.visto.toLowerCase()}` : `Adicionar ${inc.length} ${inc.length === 1 ? 'item' : 'itens'} em Almoço`
  btn.onclick = () => { btn.textContent = `✓ Adicionado (prévia, nada foi salvo)` }
  document.getElementById('dica').hidden = aberto !== null
}
render()
</script>
