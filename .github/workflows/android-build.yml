name: Build Android (.aab)

# Por que este arquivo existe:
# Compilar Android exige Android SDK + Gradle, que consomem vários GB de RAM.
# Aqui o servidor do GitHub faz esse trabalho de graça e devolve o .aab pronto
# para download — a máquina do desenvolvedor nunca compila nada.
#
# Como usar:
#   1. Suba o projeto para um repositório no GitHub.
#   2. Cadastre os Secrets listados abaixo em Settings > Secrets and variables > Actions.
#   3. Rode pela aba Actions (funciona até pelo navegador do celular).
#   4. Baixe o .aab em "Artifacts" e envie na Play Console.
#
# Secrets necessários:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#   ANDROID_KEYSTORE_BASE64  -> keystore de assinatura em base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos (strict)
        run: npm run typecheck

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Restaurar keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Gerar Android App Bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Publicar o .aab como artefato
        uses: actions/upload-artifact@v4
        with:
          name: athoslife-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
